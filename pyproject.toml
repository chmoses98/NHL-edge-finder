[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nhl-edge-finder"
version = "0.1.0"
description = "NHL Kalshi market research workstation: coherent game simulation, executable pricing, immutable point-in-time capture, settlement, calibration. RESEARCH_ONLY."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pyarrow>=17",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-xdist>=3.6",
  "hypothesis>=6.100",
  "ruff>=0.8",
]

[project.scripts]
nhl = "nhl_edge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nhl_edge = ["**/*.yaml", "**/*.json", "**/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["contract"]
addopts = "-q"
markers = ["slow: end-to-end tests that run a full simulation", "network: needs live network (never run in CI)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501", "B008", "B905"]
