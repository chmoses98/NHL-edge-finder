name: rehearsal
# Full pipeline rehearsal from a network-capable runner WITHOUT writing the production archive: context refresh,
# Kalshi discovery, market + order-book capture, RUN NHL simulate, then a second identical simulate to prove the
# append-only archive refuses a duplicate instant and a later one appends. Small summaries are committed to the
# branch it ran on (never the default branch); the full rehearsal archive is a run artifact.
on:
  workflow_dispatch:
  push:
    paths:
      - ".trigger/rehearsal"

permissions:
  contents: write

concurrency:
  group: rehearsal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      NHL_EDGE_LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Discover the Kalshi NHL universe (all statuses)
        run: nhl discover --out out/archive/catalog --raw-dir out/raw/kalshi --statuses unopened,open,closed,settled --max-pages 40
      - name: Context refresh (NHL API, MoneyPuck, DailyFaceoff, ESPN injuries)
        run: nhl context --out out/archive
      - name: Market + order-book capture
        run: nhl capture --out out/archive --orderbook --max-orderbooks 300
      - name: RUN NHL (simulate + price)
        run: nhl simulate --data data --out out/archive
      - name: Second run - idempotency (new instant appends, archive verifies)
        run: |
          sleep 2
          nhl simulate --data data --out out/archive
          python - <<'PY'
          from pathlib import Path
          from nhl_edge.archive.ledger import Ledger
          problems = Ledger(Path('out/archive')).verify()
          assert not problems, problems
          print('archive verified')
          PY
      - name: Settle + evaluate (expected to find nothing final yet)
        run: |
          nhl settle --data data --out out/archive
          nhl evaluate --data data --out out/archive
      - name: Upload rehearsal archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-${{ github.run_id }}
          path: out/
          retention-days: 14
      - name: Commit summaries to this branch (never the default branch)
        if: always()
        run: |
          set -uo pipefail
          mkdir -p docs/rehearsal data/catalog
          cp out/archive/catalog/discovery_summary.json data/catalog/ 2>/dev/null || true
          cp out/archive/catalog/discovery_summary.md data/catalog/ 2>/dev/null || true
          cp out/archive/STATUS_*.json docs/rehearsal/ 2>/dev/null || true
          cp out/archive/slates/latest/slate.md out/archive/slates/latest/slate.json out/archive/slates/latest/packet.json docs/rehearsal/ 2>/dev/null || true
          cp out/archive/eval/report.md docs/rehearsal/ 2>/dev/null || true
          (cd out/archive && find . -type f | sort | head -200 > ../../docs/rehearsal/archive_listing.txt) || true
          git config user.name "nhl-edge-bot"
          git config user.email "nhl-edge-bot@users.noreply.github.com"
          git add docs/rehearsal data/catalog
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "rehearsal: live pipeline results (run ${{ github.run_id }})"
          if [ "${GITHUB_REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
            echo "::warning title=Refusing to push to the default branch::Results are in this run's artifact."
            exit 0
          fi
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0
            sleep $((2**i))
          done
          echo "::error::could not push rehearsal results"; exit 1
