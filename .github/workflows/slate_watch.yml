name: slate-watch
# Read-only pregame watchdog (RESEARCH_ONLY). Every 30 min on game days it runs `nhl slate-check` on the published packet against the
# official schedule snapshot and writes the verdict to the job summary. It opens ONE de-duplicated issue only when the slate is NOT_READY
# with a puck drop inside 4 h (missing/misidentified game, unknown starter close to puck drop, incoherent model output, stale projection),
# and closes it when the slate recovers. DEGRADED (e.g. a goalie still unconfirmed) is never an alert. It writes nothing to any branch,
# has no secret beyond the job token, and cannot reach any price, stake, cap or order path.
# It is also the SECOND trigger of the player-layer projection chain (the capture worker is the first; projection-foundation cron the third):
# if the worker has not asked for a run the policy says is due, this job asks (workflow_dispatch of projection-foundation.yml, the only
# write it can make; `actions: write`). The policy never queues a second run while one is in flight. A second one-issue alert covers a
# late projection-foundation delivery (puck drop within 90 min, nothing in flight, newest successful run older than 4 h).
# It also asks for a `workload_shadow.yml` run (WORKLOAD_V1_LC prospective collection) when a game is within 4 h with no covering run (worker/lc_dispatch.py) and opens ONE de-duplicated
# issue only when a record is actually about to be missing (game within 90 min, no covering run queued/running/finished). Missing records are never back-filled.
# Scheduled runs are best-effort (GitHub delayed them by hours on 2026-10-22); `workflow_dispatch` runs the same check on demand.
on:
  schedule:
    - cron: "11,41 14-23,0-3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  actions: write      # dispatch projection-foundation.yml when the worker has not (worker/pf_dispatch.py); nothing else
concurrency:
  group: slate-watch
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Sparse, blobless view of data-archive (latest packet + recent schedule snapshots only)
        run: |
          set -euo pipefail
          git fetch --depth=1 --filter=blob:none origin data-archive
          git worktree add --no-checkout -f /tmp/archive FETCH_HEAD
          git -C /tmp/archive sparse-checkout init --no-cone
          pats=(/slates/latest/)
          for i in 0 1; do pats+=("/context/schedule/dt=$(date -u -d "-$i days" +%F)/"); done
          git -C /tmp/archive sparse-checkout set --no-cone "${pats[@]}"
          git -C /tmp/archive checkout -q
      - name: Slate readiness
        id: check
        run: |
          set -uo pipefail
          sched=$(ls -1 /tmp/archive/context/schedule/dt=*/*.jsonl.gz 2>/dev/null | sort | tail -1 || true)
          args=(--packet /tmp/archive/slates/latest/packet.json --out /tmp/slate_check)
          [ -n "$sched" ] && args+=(--schedule "$sched")
          nhl slate-check "${args[@]}" > /tmp/slate_check.txt; rc=$?
          mkdir -p /tmp/slate_check; cat /tmp/slate_check/slate_check.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || cat /tmp/slate_check.txt >> "$GITHUB_STEP_SUMMARY"
          verdict=$(python -c "import json;print(json.load(open('/tmp/slate_check/slate_check.json'))['verdict'])" 2>/dev/null || echo NO_REPORT)
          # "soon" comes from the OFFICIAL SCHEDULE, not from the report, so a missing or crashed report during a live slate still alerts and a quiet day never does
          soon=$(SCHED="$sched" python - <<'PY'
          import gzip, json, os, datetime as dt
          try:
              now = dt.datetime.now(dt.timezone.utc)
              rows = [json.loads(x) for x in gzip.open(os.environ["SCHED"], "rt") if x.strip()]
              print(any(r.get("status") in ("not_started", None) and 0 < (dt.datetime.fromisoformat(r["start_time_utc"].replace("Z", "+00:00")) - now).total_seconds() < 4 * 3600 for r in rows))
          except Exception:
              print("False")
          PY
          )
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"; echo "soon=$soon" >> "$GITHUB_OUTPUT"
          echo "verdict=$verdict soon=$soon rc=$rc"
      - name: Alert only on a meaningful failure (one de-duplicated issue)
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.check.outputs.verdict }}
          SOON: ${{ steps.check.outputs.soon }}
        run: |
          set -uo pipefail
          title="NHL slate NOT_READY ($(TZ=America/New_York date +%F))"
          existing=$(gh issue list --state open --search "\"NHL slate NOT_READY\" in:title" --json number,title --jq '.[0].number // empty' || true)
          if [ "$VERDICT" != "READY" ] && [ "$VERDICT" != "DEGRADED" ] && [ "$SOON" = "True" ]; then
            body=$(printf 'Automated `nhl slate-check` verdict **%s** at %s with a puck drop inside 4 h.\n\n%s\n\nRun: %s/%s/actions/runs/%s\n\n_No action is taken automatically; this issue closes itself when the slate is READY or DEGRADED again._' \
              "$VERDICT" "$(date -u +%FT%TZ)" "$(head -c 6000 /tmp/slate_check/slate_check.md 2>/dev/null || echo 'no report produced')" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
            if [ -z "$existing" ]; then
              gh issue create --title "$title" --body "$body" || true
            else
              # one comment per 3 h at most, so a persistent problem is visible but not spammed
              last=$(gh issue view "$existing" --json updatedAt --jq .updatedAt || true)
              if [ -z "$last" ] || [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -gt 10800 ]; then gh issue comment "$existing" --body "$body" || true; fi
            fi
          elif [ -n "$existing" ] && { [ "$VERDICT" = "READY" ] || [ "$VERDICT" = "DEGRADED" ]; }; then
            gh issue close "$existing" --comment "Slate recovered: verdict $VERDICT at $(date -u +%FT%TZ)." || true
          fi
      - name: Projection-foundation delivery (second trigger and lateness flag)
        id: pf
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          sched=$(ls -1 /tmp/archive/context/schedule/dt=*/*.jsonl.gz 2>/dev/null | sort | tail -1 || true)
          echo "stale=false" >> "$GITHUB_OUTPUT"; echo "recovered=false" >> "$GITHUB_OUTPUT"
          [ -n "$sched" ] || { echo "no schedule snapshot; nothing to decide"; exit 0; }
          PYTHONPATH=src python -m nhl_edge.worker.pf_dispatch dispatch --schedule "$sched" --github-output "$GITHUB_OUTPUT" > /tmp/pf_decision.json || echo "pf_dispatch failed (non-fatal)"
          { echo '### projection-foundation delivery'; echo '```json'; cat /tmp/pf_decision.json 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Alert once if the projection delivery is late
        env:
          GH_TOKEN: ${{ github.token }}
          STALE: ${{ steps.pf.outputs.stale }}
          RECOVERED: ${{ steps.pf.outputs.recovered }}
        run: |
          set -uo pipefail
          title="NHL projection delivery late"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty' || true)
          if [ "$STALE" = "true" ]; then
            body=$(printf 'Puck drop is within 90 minutes, no projection-foundation run is queued or running, and the newest successful run is older than 4 h (or absent).\n\n```json\n%s\n```\n\nRun: %s/%s/actions/runs/%s\n\n_The watchdog has already asked for a run (see the decision above); this issue closes itself when a run succeeds._' \
              "$(head -c 3000 /tmp/pf_decision.json 2>/dev/null)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
            if [ -z "$existing" ]; then gh issue create --title "$title" --body "$body" || true; fi
          elif [ -n "$existing" ] && [ "$RECOVERED" = "true" ]; then
            # only a real, recent projection-refreshing success closes it; "not stale" (a run merely queued, no schedule snapshot, API unreadable) does not
            gh issue close "$existing" --comment "Projection delivery recovered at $(date -u +%FT%TZ): a projection run succeeded within the last 4 h." || true
          fi
      - name: Pregame forecast delivery (missing or stale forecasts only)
        id: fc
        run: |
          set -uo pipefail
          echo "fc_alert=false" >> "$GITHUB_OUTPUT"; echo "fc_recovered=false" >> "$GITHUB_OUTPUT"
          sched=$(ls -1 /tmp/archive/context/schedule/dt=*/*.jsonl.gz 2>/dev/null | sort | tail -1 || true)
          [ -n "$sched" ] || { echo "no schedule snapshot; nothing to judge"; exit 0; }
          if git fetch --depth=1 --filter=blob:none origin projection-data; then
            git worktree add --no-checkout -f /tmp/pfdata FETCH_HEAD
            git -C /tmp/pfdata sparse-checkout init --no-cone
            pats=()
            for i in -2 -1 0 1 2; do d=$(date -u -d "$i days" +%F); pats+=("/forecasts/nhl/$d/" "/runs/nhl/$d/"); done
            git -C /tmp/pfdata sparse-checkout set --no-cone "${pats[@]}"
            git -C /tmp/pfdata checkout -q
            PYTHONPATH=src python -m nhl_edge.research.delivery_monitor --pf /tmp/pfdata --schedule "$sched" --out /tmp/fc_report.json --github-output "$GITHUB_OUTPUT" > /dev/null || echo "delivery_monitor failed (non-fatal)"
            { echo '### Pregame forecast delivery'; echo '```json'; head -c 3500 /tmp/fc_report.json 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "projection-data not readable; not judging"
          fi
      - name: Alert once if a pregame forecast is actually missing or stale
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT: ${{ steps.fc.outputs.fc_alert }}
          RECOVERED: ${{ steps.fc.outputs.fc_recovered }}
        run: |
          set -uo pipefail
          title="NHL pregame forecast missing or stale"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty' || true)
          if [ "$ALERT" = "true" ]; then
            body=$(printf 'A game starts within 90 minutes and its player-projection forecast is **missing** (no pregame row exists) or **stale** (the newest projection run that evaluated the game, or the lineup capture it used, is too old). A forecast whose *values* did not change is not a problem and never raises this issue.\n\n```json\n%s\n```\n\nRun: %s/%s/actions/runs/%s\n\n_Opened automatically; nothing is changed automatically. It closes itself when every game within 90 minutes is covered by a recent evaluation._' \
              "$(head -c 3000 /tmp/fc_report.json 2>/dev/null)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
            if [ -z "$existing" ]; then gh issue create --title "$title" --body "$body" || true; fi
          elif [ -n "$existing" ] && [ "$RECOVERED" = "true" ]; then
            gh issue close "$existing" --comment "Forecast delivery recovered at $(date -u +%FT%TZ): every game within 90 minutes has a recent evaluation and a pregame forecast." || true
          fi
      - name: WORKLOAD_V1_LC collection (third trigger and coverage flag)
        id: lc
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          sched=$(ls -1 /tmp/archive/context/schedule/dt=*/*.jsonl.gz 2>/dev/null | sort | tail -1 || true)
          echo "lc_gap=false" >> "$GITHUB_OUTPUT"; echo "lc_recovered=false" >> "$GITHUB_OUTPUT"
          [ -n "$sched" ] || { echo "no schedule snapshot; nothing to decide"; exit 0; }
          PYTHONPATH=src python -m nhl_edge.worker.lc_dispatch dispatch --schedule "$sched" --github-output "$GITHUB_OUTPUT" > /tmp/lc_decision.json || echo "lc_dispatch failed (non-fatal)"
          { echo '### WORKLOAD_V1_LC collection'; echo '```json'; cat /tmp/lc_decision.json 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Alert once if a game is about to start with no pregame record on the way
        env:
          GH_TOKEN: ${{ github.token }}
          GAP: ${{ steps.lc.outputs.lc_gap }}
          RECOVERED: ${{ steps.lc.outputs.lc_recovered }}
        run: |
          set -uo pipefail
          title="NHL workload shadow collection gap"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty' || true)
          if [ "$GAP" = "true" ]; then
            body=$(printf 'A regular-season game starts within 90 minutes, no `workload-shadow` run that started inside its 14-hour horizon is queued, running or finished, so its WORKLOAD_V1_LC pregame record may be missing. Missing records are **never back-filled**; they are listed in the coverage report.\n\n```json\n%s\n```\n\nRun: %s/%s/actions/runs/%s\n\n_Opened automatically; it closes itself when every game within 90 minutes is covered. An unchanged prediction is not a reason for this alert._' \
              "$(head -c 3000 /tmp/lc_decision.json 2>/dev/null)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
            if [ -z "$existing" ]; then gh issue create --title "$title" --body "$body" || true; fi
          elif [ -n "$existing" ] && [ "$RECOVERED" = "true" ]; then
            gh issue close "$existing" --comment "Collection covered again at $(date -u +%FT%TZ): every game within 90 minutes has a covering run." || true
          fi
