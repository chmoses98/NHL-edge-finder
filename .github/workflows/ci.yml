name: ci
on:
  push:
    branches-ignore: ["data-archive"]  # the bot pushes snapshots there every few minutes; it carries no code to test
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest -q -n auto
      - name: CLI smoke
        run: nhl --help && PYTHONPATH=src python -m nhl_edge.workflows.conductor --data data
