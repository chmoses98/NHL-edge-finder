name: sealed_ledger_admin
# NHL prospective research ledger -- SENSITIVE ADMINISTRATION (RESEARCH_ONLY). Manual dispatch only; the publish job waits for the OWNER'S APPROVAL (environment
# `sealed-ledger-admin` with the owner as required reviewer). Use it only for what routine collection must never do by itself:
#   init     one time: create the ledger (genesis + a SYNTHETIC canary ciphertext, no game) so the owner can verify it and register its genesis hash first;
#   correct  a hand-applied versioned correction (the unattended pass already applies source revisions; this is for exceptions);
#   exclude  a hand-applied exclusion of a scheduled game that cannot be settled by the prespecified rule (an exception the unattended pass reported);
#   accept_missing  close a day on which NO final game has a pregame forecast, declaring them all missing (a public data gap the unattended pass refuses to close by itself).
# Key changes (recipients.txt) and protocol changes are code changes on `main` that need the owner's review; they invalidate the activation hash / the genesis protocol hash and
# stop routine publishing until the owner re-registers. Decryption and the looks happen only on the owner's own machine (owner.py). Nothing here touches a model, weight,
# recommendation, stake or cap: this workflow has no write permission on this repository.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "init | correct | exclude | accept_missing"
        required: true
        type: choice
        options: [init, correct, exclude, accept_missing]
      date:
        description: "ET date (YYYY-MM-DD) the correction/exclusion applies to (ignored for init)"
        required: false
        default: "2026-10-21"
      game_ids:
        description: "correct: comma-separated GAME_ID@CURRENT_VERSION; exclude: comma-separated game ids (ignored for init)"
        required: false
        default: ""
      reason:
        description: "correct: SOURCE_SCORE_REVISED | PIPELINE_DEFECT_FIXED | OTHER_DOCUMENTED; exclude: POSTPONED_OR_CANCELLED | START_TIME_BOUNDARY | OTHER_DOCUMENTED"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: sealed-ledger-admin
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      action: ${{ steps.plan.outputs.action }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Plan (validate; inputs are only ever used through env vars)
        id: plan
        env:
          IN_ACTION: ${{ github.event.inputs.action }}
          IN_DATE: ${{ github.event.inputs.date }}
          IN_IDS: ${{ github.event.inputs.game_ids }}
          IN_REASON: ${{ github.event.inputs.reason }}
          LEDGER_REPO: ${{ vars.SEALED_LEDGER_REPO }}
          CODE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$IN_ACTION" =~ ^(init|correct|exclude|accept_missing)$ ]] || { echo "::error::bad action"; exit 1; }
          [[ "$IN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::bad date"; exit 1; }
          [[ "$LEDGER_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::repository variable SEALED_LEDGER_REPO is not set"; exit 1; }
          [ "${LEDGER_REPO,,}" != "${CODE_REPO,,}" ] || { echo "::error::the ledger repository must differ from the code repository"; exit 1; }
          if [ "$IN_ACTION" = correct ]; then
            [[ "$IN_IDS" =~ ^[0-9A-Za-z_-]+@[1-9][0-9]*(,[0-9A-Za-z_-]+@[1-9][0-9]*)*$ ]] || { echo "::error::correct needs GAME_ID@CURRENT_VERSION[,...]"; exit 1; }
            [[ "$IN_REASON" =~ ^(SOURCE_SCORE_REVISED|PIPELINE_DEFECT_FIXED|OTHER_DOCUMENTED)$ ]] || { echo "::error::a correction needs a valid reason"; exit 1; }
          elif [ "$IN_ACTION" = exclude ]; then
            [[ "$IN_IDS" =~ ^[0-9A-Za-z_-]+(,[0-9A-Za-z_-]+)*$ ]] || { echo "::error::exclude needs game ids"; exit 1; }
            [[ "$IN_REASON" =~ ^(POSTPONED_OR_CANCELLED|START_TIME_BOUNDARY|OTHER_DOCUMENTED)$ ]] || { echo "::error::an exclusion needs a valid reason"; exit 1; }
          fi  # (accept_missing needs only the date)
          echo "action=$IN_ACTION" >> "$GITHUB_OUTPUT"
      - name: Precheck (the sealed ledger must be set up; fails closed)
        run: |
          set -euo pipefail
          grep -qE '^age1[0-9a-z]{50,}$' research/sealed_ledger/recipients.txt || { echo "::error::no owner public key in research/sealed_ledger/recipients.txt (the sealed ledger is not set up)"; exit 1; }
      - name: Refuse to run if the tree contains private key material
        run: |
          set -euo pipefail
          if grep -rIlE 'AGE-SECRET-KEY-1[0-9A-Z]{50,}|-----BEGIN (ENCRYPTED |EC |RSA |OPENSSH )?PRIVATE KEY-----' --exclude-dir=.git . ; then
            echo "::error::private key material found in the repository tree"; exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install hash-locked dependencies
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements/research-runtime.lock
          echo "PYTHONPATH=$GITHUB_WORKSPACE/src" >> "$GITHUB_ENV"
      - name: Fetch a sparse read-only copy of the archive
        if: ${{ steps.plan.outputs.action != 'init' }}
        env:
          SLATE_DATE: ${{ github.event.inputs.date }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin data-archive
          mkdir -p "$RUNNER_TEMP/rd/archive"
          paths=(manifest.jsonl results settlements context/schedule context/goalie_observations context/sportsbook_odds context/team_games player_events)
          d=2026-10-21
          while [[ "$d" < "$SLATE_DATE" || "$d" == "$SLATE_DATE" ]]; do
            if git cat-file -e "origin/data-archive:slates/dt=${d}" 2>/dev/null; then paths+=("slates/dt=${d}"); fi
            d=$(date -I -d "$d + 1 day")
          done
          git archive origin/data-archive "${paths[@]}" | tar -x -C "$RUNNER_TEMP/rd/archive"
      - name: Restore the PUBLIC sealed ledger from its own repository (read-only, anonymous)
        env:
          LEDGER_REPO: ${{ vars.SEALED_LEDGER_REPO }}
          ACTION: ${{ steps.plan.outputs.action }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rd/store_prev" "$RUNNER_TEMP/rd/out"
          git clone --depth 1 "https://github.com/${LEDGER_REPO}.git" "$RUNNER_TEMP/rd/store"
          if [ "$ACTION" = init ]; then
            [ ! -e "$RUNNER_TEMP/rd/store/manifest.jsonl" ] || { echo "::error::init refused: the ledger repository already holds a ledger"; exit 1; }
            rm -rf "$RUNNER_TEMP/rd/store"; mkdir -p "$RUNNER_TEMP/rd/store"
          else
            test -f "$RUNNER_TEMP/rd/store/manifest.jsonl" || { echo "::error::the ledger repository holds no ledger yet"; exit 1; }
            rm -rf "$RUNNER_TEMP/rd/store/.git"
            cp -a "$RUNNER_TEMP/rd/store/." "$RUNNER_TEMP/rd/store_prev/"
            python -m nhl_edge.sealed_ledger.runner verify --store "$RUNNER_TEMP/rd/store" --recipients research/sealed_ledger/recipients.txt
          fi
      - name: Apply the action to the staged ledger (the summary is outcome-free)
        env:
          ACTION: ${{ steps.plan.outputs.action }}
          SLATE_DATE: ${{ github.event.inputs.date }}
          IDS: ${{ github.event.inputs.game_ids }}
          REASON: ${{ github.event.inputs.reason }}
        run: |
          set -euo pipefail
          store="$RUNNER_TEMP/rd/store"; rec=research/sealed_ledger/recipients.txt; out="$RUNNER_TEMP/rd/out/admin_summary.json"
          case "$ACTION" in
            init)    python -m nhl_edge.sealed_ledger.runner init --store "$store" --recipients "$rec" --summary-out "$out" ;;
            correct) python -m nhl_edge.sealed_ledger.runner ingest --archive "$RUNNER_TEMP/rd/archive" --date "$SLATE_DATE" --repo . --store "$store" --recipients "$rec" --seal --correct "$IDS" --reason "$REASON" --summary-out "$out" ;;
            exclude) python -m nhl_edge.sealed_ledger.runner ingest --archive "$RUNNER_TEMP/rd/archive" --date "$SLATE_DATE" --repo . --store "$store" --recipients "$rec" --seal --exclude "$IDS" --exclude-reason "$REASON" --summary-out "$out" ;;
            accept_missing) python -m nhl_edge.sealed_ledger.runner ingest --archive "$RUNNER_TEMP/rd/archive" --date "$SLATE_DATE" --repo . --store "$store" --recipients "$rec" --seal --accept-missing-forecasts --summary-out "$out" ;;
          esac
      - name: The new manifest must extend the previous one (append-only)
        if: ${{ steps.plan.outputs.action != 'init' }}
        run: python -m nhl_edge.sealed_ledger.runner verify --store "$RUNNER_TEMP/rd/store" --recipients research/sealed_ledger/recipients.txt --previous "$RUNNER_TEMP/rd/store_prev"
      - name: Verify the staged directory holds only ciphertext, the manifest and checkpoints
        run: python -m nhl_edge.sealed_ledger.runner verify --store "$RUNNER_TEMP/rd/store" --recipients research/sealed_ledger/recipients.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sealed-ledger-admin-report-${{ github.run_id }}
          path: ${{ runner.temp }}/rd/out/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sealed-ledger-admin-staging-${{ github.run_id }}
          path: ${{ runner.temp }}/rd/store/
          retention-days: 1

  publish:
    needs: settle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: sealed-ledger-admin   # required reviewer = the owner; the job (and its deploy-key secret) is released only after the owner approves
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install hash-locked dependencies
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements/sealed-publish.lock
          echo "PYTHONPATH=$GITHUB_WORKSPACE/src" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sealed-ledger-admin-staging-${{ github.run_id }}
          path: ${{ runner.temp }}/staged
      - name: Publish to the ledger repository (fast-forward only; fails closed unless the owner's setup is complete)
        env:
          MODE: ${{ needs.settle.outputs.action == 'init' && 'init' || 'append' }}
          STAGED: ${{ runner.temp }}/staged
          LEDGER_REPO: ${{ vars.SEALED_LEDGER_REPO }}
          CODE_REPO: ${{ github.repository }}
          ACTIVATION: ${{ vars.SEALED_LEDGER_ACTIVATION_SHA }}
          GENESIS: ${{ vars.SEALED_LEDGER_GENESIS_HASH }}
          DEPLOY_KEY: ${{ secrets.SEALED_LEDGER_DEPLOY_KEY }}
          MESSAGE: "sealed-ledger: admin ${{ needs.settle.outputs.action }} (run ${{ github.run_id }})"
        run: scripts/sealed_ledger_publish.sh
