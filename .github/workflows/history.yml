name: history-pull
# Manual: pull the historical NHL dataset (MoneyPuck team game-by-game rows + official NHL results) into Parquet
# from a network-capable runner, run the DATA_ONLY_V1 walk-forward evaluation on it, and commit the compact dataset
# plus the research outputs back to the branch it ran on. The dev container cannot reach moneypuck.com or nhle.com,
# so this workflow is the only place the pull actually happens. RESEARCH_ONLY: nothing here touches a market.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Comma list of MoneyPuck seasons (start year; 2025 == 2025-26)"
        default: "2022,2023,2024,2025"
      test_seasons:
        description: "Seasons to score in the walk-forward"
        default: "2024,2025"
      n_sims:
        description: "Simulation draws per game"
        default: "4000"
  push:
    paths:
      - ".trigger/history"

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  SEASONS: ${{ inputs.seasons || '2022,2023,2024,2025' }}
  TEST_SEASONS: ${{ inputs.test_seasons || '2024,2025' }}
  N_SIMS: ${{ inputs.n_sims || '4000' }}
  MAX_DATASET_MB: 90

permissions:
  contents: write

concurrency:
  group: history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pull history (MoneyPuck all_teams.csv + NHL stats game lists)
        env:
          NHL_EDGE_LOG_LEVEL: INFO
        run: python -m nhl_edge.data.history --out data/history --seasons "$SEASONS"
      - name: Show manifest
        if: always()
        run: cat data/history/MANIFEST.json || true
      - name: Dataset size guard
        if: always()
        run: |
          set -uo pipefail
          du -sh data/history/* || true
          mb=$(du -sm data/history | cut -f1)
          echo "data/history = ${mb} MB"
          if [ "$mb" -gt "$MAX_DATASET_MB" ]; then
            echo "::error title=History dataset too large::${mb} MB > ${MAX_DATASET_MB} MB; drop seasons or situations before committing"
            exit 1
          fi
      - name: Walk-forward evaluation (historical, no market data)
        env:
          NHL_EDGE_LOG_LEVEL: INFO
        run: |
          python -m nhl_edge.research.walk_forward --history data/history --out docs/research \
            --test-seasons "$TEST_SEASONS" --n-sims "$N_SIMS" --run "${{ github.run_id }}"
      - name: Show walk-forward summary
        if: always()
        run: cat docs/research/WALK_FORWARD_V1.md || true
      - name: Commit dataset and research outputs (never to the default branch)
        if: always()
        run: |
          set -uo pipefail
          git config user.name "nhl-edge-bot"
          git config user.email "nhl-edge-bot@users.noreply.github.com"
          git add -f data/history/MANIFEST.json data/history/moneypuck/*.parquet data/history/nhl/*.parquet 2>/dev/null || true
          git add docs/research/WALK_FORWARD_V1.md docs/research/walk_forward_*.json docs/research/walk_forward_*_games.csv 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "history: MoneyPuck+NHL dataset ($SEASONS) and walk-forward V1 (run ${{ github.run_id }})"
          # Never rewrite the default branch unattended (copied from nba-edge-finder: a merged trigger file once fired
          # a pull that committed data straight to main with no review). The data is in this run's artifact either way.
          if [ "${GITHUB_REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
            echo "::warning title=Refusing to push to the default branch::Ran on ${GITHUB_REF_NAME}. The dataset is in this run's workspace/artifact; re-run this workflow on a branch to commit it."
            exit 0
          fi
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0
            sleep $((2**i))
          done
          echo "::error::could not push history dataset"; exit 1
      - name: Preserve the dataset and research outputs as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-dataset-${{ github.run_id }}
          path: |
            data/history
            docs/research
          retention-days: 14
