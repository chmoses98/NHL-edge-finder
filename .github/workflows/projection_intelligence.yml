name: projection-intelligence
# Daily READ-ONLY evaluation of the frozen PLAYER_SIM_V1 forecasts joined to entry quotes and outcomes
# (data-archive evaluations_player) with chmoses98/sift-sports-intelligence research/intelligence. RESEARCH ONLY: no authority,
# nothing is pushed to any branch; result = job summary + retained artifact. Errors fail the job (observable).
# Inert until merged (schedules fire from the default branch only).
on:
  schedule:
    - cron: "47 10 * * *"
  workflow_dispatch:
    inputs:
      intelligence_ref:
        default: "main"
permissions:
  contents: read
concurrency:
  group: projection-intelligence
  cancel-in-progress: false
defaults:
  run:
    shell: bash -eo pipefail {0}
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/checkout@v4
        with:
          repository: chmoses98/sift-sports-intelligence
          ref: ${{ github.event.inputs.intelligence_ref || 'main' }}
          path: sift
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q numpy pandas
      - name: Sparse, blobless view of data-archive (evaluations only; the branch is multi-GB)
        run: |
          git fetch --depth=1 --filter=blob:none origin data-archive
          rm -rf /tmp/archive && git worktree add --no-checkout -f /tmp/archive origin/data-archive
          git -C /tmp/archive sparse-checkout init --no-cone
          git -C /tmp/archive sparse-checkout set /evaluations_player/
          git -C /tmp/archive checkout -q
          du -sh /tmp/archive
      - name: Evaluate
        run: |
          mkdir -p out
          (cd sift && python3 -m research.intelligence.adapters.nhl /tmp/archive ../out/nhl_evaluation.json)
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("out/nhl_evaluation.json"))
          print("### NHL projection intelligence")
          print("status:", r.get("status"), "| status_counts:", r.get("status_counts"))
          print("accounting:", json.dumps(r.get("accounting"))[:700])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nhl-projection-intelligence
          path: out/nhl_evaluation.json
          retention-days: 90
