name: projection-foundation
run-name: projection-foundation ${{ github.event_name }}${{ github.event.inputs.stages && format(' [{0}]', github.event.inputs.stages) || '' }}${{ github.event.inputs.dry_run == 'true' && ' dry-run' || '' }}
# NHL Projection Foundation: live SHADOW operation (RESEARCH ONLY, no betting authority).
#
# WHO STARTS A RUN (docs/research/PROJECTION_DELIVERY.md): the capture worker (worker/pf_dispatch.py) asks for the chain on a horizon-aware
# cadence, the slate-watch watchdog asks again if the worker is gone, and cron below is the third and last fallback. A cron run does not
# blindly execute: its first step (the gate) asks the same policy whether a run is wanted and exits in about a minute if not. Explicit
# requests (workflow_dispatch from the worker/watchdog/a human, and the pull_request dry run) always run. A gated-out cron run cancels itself,
# so a no-op is never mistaken for a fresh projection by the dispatch policy.
#   capture   data-archive DailyFaceoff / ESPN captures (+ direct fetch) -> immutable pf_core availability snapshots
#   project   frozen models (cached per slate) + participation + gate -> challenger AND incumbent (PLAYER_SIM_V1) forecasts
#   publish   projections/nhl/latest.json (+ timestamped copy), summary/nhl/latest.json
#   results   FINAL box scores -> outcomes;  settle  settle-once (+ corrections);  score  daily/weekly/season scorecards
#   guard     pf_core.archive_guard: the immutable archive directories only ever gain files
# Everything lands on the orphan branch `projection-data`. A failed stage fails the job and nothing is committed afterwards
# (the next run redoes the idempotent stages). The pull_request run executes the SAME chain with --dry-run (live fetches, real
# projections, gate, archive into a temp copy, settle/score against the existing archive) with a read-only token.
# Schedules fire from the default branch only. No secrets beyond the job token, no paid services.
on:
  schedule:
    # FALLBACK ONLY, in UTC and without DST duplicates (the in-job gate reads the real schedule, so no ET translation is needed).
    # 2026-10-22 evidence: cron slots were delivered 2.2-4.4 h late and each needed two runner requests; a no-op duplicate run could
    # also take the single pending concurrency slot. The gate is now inside the one job and cron has its own concurrency group.
    - cron: "7 11,14,16,18,20,21,22,23 * 1-6,10-12 *"
    - cron: "7 0,1 * 1-6,10-12 *"
    - cron: "37 10,12 * 1-6,10-12 *"       # settle-oriented fallback (the gate picks the stages)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the whole chain but write only to a temp copy (nothing is pushed)"
        type: boolean
        default: false
      stages:
        description: "Comma list of stages (default all): capture,project,publish,results,settle,score,guard"
        required: false
        default: "all"
  pull_request:
    paths:
      - "research/projection_foundation/**"
      - ".github/workflows/projection-foundation.yml"
defaults:
  run:
    shell: bash
concurrency:
  # Three groups, so that a request can never be cancelled by an unrelated one:
  #   pull_request  one per ref, newer cancels older (a dry run is disposable)
  #   schedule      cron fallbacks queue among themselves, never behind or in front of a worker-requested run
  #   everything else (worker / watchdog / human dispatch): one running + one pending; the policy never queues a second while one is in
  #                 flight, because a later pending run REPLACES the earlier one and the earlier one's place in the runner queue is lost
  # ci_publish.sh re-applies our files on a moved remote, so two writers are safe; the groups exist for efficiency, not correctness.
  group: ${{ github.event_name == 'pull_request' && format('projection-foundation-nhl-pr-{0}', github.ref) || (github.event_name == 'schedule' && 'projection-foundation-nhl-cron' || 'projection-foundation-nhl') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  PF_DIR: research/projection_foundation
jobs:
  # ------------------------------------------------------------------------------------------ pull_request: dry run, read-only
  pr-dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -q -r research/projection_foundation/requirements-pf.txt
      - name: Unit + smoke tests (NHL live package, pf_core)
        working-directory: research/projection_foundation
        run: python -m pytest tests/test_nhl_live.py tests/test_nhl_season.py tests/test_pf_live.py tests/test_pf_core.py -q -x
      - name: Sparse, blobless view of data-archive (inputs only)
        run: bash research/projection_foundation/nhl/live/ci_data_archive.sh /tmp/data_archive
      - name: Check out projection-data read-only (empty temp repo if the branch does not exist yet)
        run: bash research/projection_foundation/nhl/live/ci_projection_data.sh /tmp/projection_data readonly
      - name: Restore frozen-model cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/nhl_pf_cache/model_tables
          key: nhl-model-v2-${{ hashFiles('research/projection_foundation/requirements-pf.txt') }}-pr-${{ github.run_id }}
          restore-keys: nhl-model-v2-${{ hashFiles('research/projection_foundation/requirements-pf.txt') }}-
      - name: Full chain --dry-run (live fetch, real projections, gate, temp archive, settle/score)
        working-directory: research/projection_foundation
        env:
          NHL_PF_ARCHIVE: /tmp/data_archive
          NHL_PF_CACHE: /tmp/nhl_pf_cache/frames
          NHL_PF_MODELS: /tmp/nhl_pf_cache/model_tables
        run: |
          set -euo pipefail
          mkdir -p "$NHL_PF_CACHE" "$NHL_PF_MODELS" /tmp/nhl_work
          python -W ignore -m nhl.live.run --stage all --archive /tmp/projection_data --data-archive /tmp/data_archive \
            --live-fetch --dry-run --work /tmp/nhl_work 2>&1 | tee /tmp/nhl_work/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhl-live-dry-run
          path: /tmp/nhl_work/
          retention-days: 14

  # ------------------------------------------------------------------------------------------ pull_request: verification evidence
  # Re-runs the committed study and replays one past slate with the REAL frozen models on the runner (the sandbox is ~10x slower).
  pr-replay:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -q -r research/projection_foundation/requirements-pf.txt
      - name: Sparse, blobless view of data-archive (inputs only)
        run: bash research/projection_foundation/nhl/live/ci_data_archive.sh /tmp/data_archive
      - name: Replay a slate from two days ago end to end (3 pregame runs, puck drop, settle, rerun, correction)
        working-directory: research/projection_foundation
        run: |
          set -euo pipefail
          # the sparse data-archive view holds the last 4 days of captures: replay the newest slate that is at least 2 days old
          python -W ignore -m nhl.live.smoke --date auto --data-archive /tmp/data_archive --out /tmp/smoke 2>&1 | tee /tmp/smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhl-live-replay
          path: |
            /tmp/smoke.log
            /tmp/smoke/smoke_report.json
          retention-days: 14

  pr-repro:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -q -r research/projection_foundation/requirements-pf.txt
      - name: Sparse, blobless view of data-archive (inputs only)
        run: bash research/projection_foundation/nhl/live/ci_data_archive.sh /tmp/data_archive
      - name: No-leakage + shared-library tests
        working-directory: research/projection_foundation
        run: python -m pytest tests/test_nhl.py tests/test_nhl_season.py tests/test_pf_core.py tests/test_pf_live.py -q
      - name: Rebuild the study (pf_core 1.2.0) and compare with the committed results
        working-directory: research/projection_foundation
        env:
          NHL_PF_ARCHIVE: /tmp/data_archive
          NHL_PF_CACHE: /tmp/repro_cache
        run: |
          set -euo pipefail
          mkdir -p /tmp/committed /tmp/repro_cache
          cp results/nhl_full_results.json results/summary.json /tmp/committed/
          rm -rf results/experiments
          python -W ignore -m nhl.pipeline all --rebuild 2>&1 | tail -5
          python -W ignore -m nhl.run_walkforward 2>&1 | tail -5
          python -W ignore -m nhl.report 2>&1 | tail -2
          python -m nhl.live.repro_check /tmp/committed/nhl_full_results.json results/nhl_full_results.json \
            /tmp/committed/summary.json results/summary.json | tee /tmp/repro_check.json
          cp results/nhl_full_results.json /tmp/regenerated_full_results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhl-repro
          path: |
            /tmp/repro_check.json
            /tmp/regenerated_full_results.json
          retention-days: 14

  # ------------------------------------------------------------------------------------------ schedule / dispatch: live
  live:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      actions: write     # the gate lists THIS workflow's own runs, and cancels its own run when it decides nothing is due (see below)
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Latest schedule snapshot only (all the gate needs; the full input view is fetched only if the chain will run)
        run: |
          set -euo pipefail
          git fetch --depth=1 --filter=blob:none origin data-archive
          git worktree add --no-checkout -f /tmp/gate_archive FETCH_HEAD
          git -C /tmp/gate_archive sparse-checkout init --no-cone
          pats=(); for i in 0 1; do pats+=("/context/schedule/dt=$(date -u -d "-$i days" +%F)/"); done
          git -C /tmp/gate_archive sparse-checkout set --no-cone "${pats[@]}"
          git -C /tmp/gate_archive checkout -q
      - name: Gate (policy decides cron runs; explicit requests always run)
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          STAGES_INPUT: ${{ github.event.inputs.stages }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          sched=$(ls -1 /tmp/gate_archive/context/schedule/dt=*/*.jsonl.gz 2>/dev/null | sort | tail -1 || true)
          rc=1
          if [ -n "$sched" ]; then
            PYTHONPATH=src python3 -m nhl_edge.worker.pf_dispatch gate --event "$EVENT_NAME" --stages-input "${STAGES_INPUT:-}" \
              --exclude-run "$RUN_ID" --schedule "$sched" --github-output "$GITHUB_OUTPUT"
            rc=$?
          fi
          if [ "$rc" != 0 ]; then
            # no schedule snapshot or the gate itself failed: the chain is idempotent, so run rather than skip (fail open)
            echo "::warning::gate unavailable (rc=$rc); running the chain"
            { echo "run=true"; echo "stages=${STAGES_INPUT:-all}"; } >> "$GITHUB_OUTPUT"
          fi
      - name: "Gated out - mark this run cancelled so it can never be mistaken for a fresh projection"
        # A skipped run would otherwise conclude `success` and look like a chain run to the dispatcher (worker/pf_dispatch.py counts only
        # successful runs as fresh). Cancelled runs are ignored by it.
        if: steps.gate.outputs.run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" || true
      - name: Sparse, blobless view of data-archive (inputs only)
        if: steps.gate.outputs.run == 'true'
        run: bash research/projection_foundation/nhl/live/ci_data_archive.sh /tmp/data_archive
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with: { python-version: "3.13" }
      - run: pip install -q -r research/projection_foundation/requirements-pf.txt
        if: steps.gate.outputs.run == 'true'
      - name: Check out projection-data (orphan branch is created on the first run)
        if: steps.gate.outputs.run == 'true'
        run: bash research/projection_foundation/nhl/live/ci_projection_data.sh /tmp/projection_data live
      - name: Restore frozen-model cache (same slate date)
        if: steps.gate.outputs.run == 'true'
        id: mc
        uses: actions/cache/restore@v4
        with:
          path: /tmp/nhl_pf_cache/model_tables
          key: nhl-model-v2-${{ hashFiles('research/projection_foundation/requirements-pf.txt') }}-${{ github.run_id }}
          restore-keys: nhl-model-v2-${{ hashFiles('research/projection_foundation/requirements-pf.txt') }}-
      - name: Run the chain
        if: steps.gate.outputs.run == 'true'
        id: chain
        working-directory: research/projection_foundation
        env:
          NHL_PF_ARCHIVE: /tmp/data_archive
          NHL_PF_CACHE: /tmp/nhl_pf_cache/frames
          NHL_PF_MODELS: /tmp/nhl_pf_cache/model_tables
          DRY: ${{ github.event.inputs.dry_run }}
          STAGES: ${{ steps.gate.outputs.stages }}
        run: |
          set -euo pipefail
          mkdir -p "$NHL_PF_CACHE" "$NHL_PF_MODELS" /tmp/nhl_work
          ls "$NHL_PF_MODELS" | head -5 || true
          args=(--stage "$STAGES" --archive /tmp/projection_data --data-archive /tmp/data_archive --live-fetch --work /tmp/nhl_work)
          if [ "$DRY" = "true" ]; then args+=(--dry-run); fi
          python -W ignore -m nhl.live.run "${args[@]}" 2>&1 | tee /tmp/nhl_work/run.log
          if grep -q '"model_reused": false' /tmp/nhl_work/run.log; then echo "computed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Commit to projection-data (only after every stage succeeded; archive_guard first)
        if: ${{ steps.gate.outputs.run == 'true' && github.event.inputs.dry_run != 'true' }}
        run: bash research/projection_foundation/nhl/live/ci_publish.sh /tmp/projection_data
      - name: Save frozen-model cache (only when a new table was computed)
        if: ${{ success() && steps.chain.outputs.computed == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: /tmp/nhl_pf_cache/model_tables
          key: nhl-model-v2-${{ hashFiles('research/projection_foundation/requirements-pf.txt') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.gate.outputs.run == 'true' }}
        with:
          name: nhl-live-run
          path: /tmp/nhl_work/
          retention-days: 14
