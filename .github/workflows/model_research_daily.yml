name: model_research_daily
# NHL model-research daily feedback loop (RESEARCH_ONLY). DISABLED BY DEFAULT: manual dispatch only, the schedule below is commented out and enabling it needs an
# explicit decision. Reads a SPARSE read-only copy of data-archive (only the kinds the loop needs), settles ONE slate date of post-freeze games into an append-only
# game ledger, writes a BLINDED scorecard (counts + pregame data quality only, no outcome-derived number before the first predeclared look of 150 games), and
# uploads only that scorecard and an outcome-free ingest summary. The ledger (which holds outcomes) is NEVER part of the default artifact: it leaves the runner only
# when `publish` is true, through a separate job that alone holds write permission and makes a normal (never forced) commit on its own branch
# `model-research-ledger`. It never writes to the default branch, data-archive or accounting-data, places or routes no wager, changes no model, stake or cap,
# retrains nothing and promotes nothing.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Slate date (ET, YYYY-MM-DD) to settle"
        required: true
      publish:
        description: "Append the ledger to the model-research-ledger branch (true/false)"
        required: false
        default: "false"
  # schedule:                      # ENABLE ONLY WITH EXPLICIT APPROVAL; one short run per day (~3-6 min)
  #   - cron: "17 12 * * *"

permissions:
  contents: read

concurrency:
  group: model-research-daily
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Refuse publish while the ledger has no isolated storage (repository is PUBLIC)
        if: ${{ github.event.inputs.publish == 'true' }}
        run: |
          echo "::error::publish=true is disabled: this repository is public, so a ledger branch would expose the outcome-bearing prospective ledger to everyone. See docs/research/nhl-model-improvement/LEDGER_ISOLATION_REVIEW.md."
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]" scipy statsmodels
      - name: Fetch a sparse read-only copy of the archive
        env:
          SLATE_DATE: ${{ github.event.inputs.date }}
        run: |
          set -euo pipefail
          [[ "$SLATE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "bad date"; exit 1; }
          git fetch --depth=1 origin data-archive
          mkdir -p $RUNNER_TEMP/rd/archive
          paths=(manifest.jsonl results settlements context/schedule context/goalie_observations context/sportsbook_odds context/team_games player_events)
          if git cat-file -e "origin/data-archive:slates/dt=${SLATE_DATE}" 2>/dev/null; then paths+=("slates/dt=${SLATE_DATE}"); else echo "no slate runs for ${SLATE_DATE}"; fi
          git archive origin/data-archive "${paths[@]}" | tar -x -C $RUNNER_TEMP/rd/archive
      - name: Restore the ledger (read-only fetch; if the branch exists)
        run: |
          set -euo pipefail
          mkdir -p $RUNNER_TEMP/rd/ledger $RUNNER_TEMP/rd/out
          if git ls-remote --exit-code --heads origin model-research-ledger >/dev/null 2>&1; then
            git fetch --depth=1 origin model-research-ledger
            git show origin/model-research-ledger:shadow_game_ledger.jsonl > $RUNNER_TEMP/rd/ledger/shadow_game_ledger.jsonl
          fi
      - name: Settle the date (idempotent per game; summary is outcome-free)
        env:
          SLATE_DATE: ${{ github.event.inputs.date }}
        run: python -m nhl_edge.model_research.daily ingest --archive $RUNNER_TEMP/rd/archive --date "$SLATE_DATE" --repo . --ledger $RUNNER_TEMP/rd/ledger/shadow_game_ledger.jsonl --summary-out $RUNNER_TEMP/rd/out/ingest_summary.json
      - name: Blinded scorecard
        run: python -m nhl_edge.model_research.daily scorecard --ledger $RUNNER_TEMP/rd/ledger/shadow_game_ledger.jsonl --out $RUNNER_TEMP/rd/out
      - name: Verify blinding (fails the run if a look or an outcome-derived field appears early)
        run: |
          python - <<'PY'
          import glob, json, os
          rd = os.environ["RUNNER_TEMP"] + "/rd"
          sc = json.load(open(rd + "/out/SHADOW_SCORECARD.json"))
          looks = glob.glob(rd + "/out/LOOK_*.json")
          print("status:", sc["status"], "| n_prospective_games:", sc["n_prospective_games"], "| LOOK files:", looks)
          if sc["n_prospective_games"] < 150:
              assert sc["status"] == "ACCUMULATING_BLINDED", sc["status"]
              assert not looks, "a LOOK file exists before 150 eligible games"
              assert "look" not in sc
          allowed = {"n_prospective_games", "tier", "looks", "next_look_at_games", "data_quality", "alarms", "status", "note"}
          if sc["n_prospective_games"] < 150:
              assert set(sc) <= allowed, sorted(set(sc) - allowed)
          print("blinding verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: model-research-blinded-${{ github.run_id }}
          path: ${{ runner.temp }}/rd/out/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.publish == 'true' }}
        with:
          name: model-research-ledger-staging-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/rd/ledger/shadow_game_ledger.jsonl
            ${{ runner.temp }}/rd/out/SHADOW_SCORECARD.json
          retention-days: 1

  publish:
    needs: settle
    if: ${{ github.event.inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # the only write grant in this workflow; pushes to model-research-ledger and nothing else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: model-research-ledger-staging-${{ github.run_id }}
          path: /tmp/ledger_in
      - name: Commit to model-research-ledger (normal commit, never forced)
        env:
          SLATE_DATE: ${{ github.event.inputs.date }}
        run: |
          set -euo pipefail
          led=$(find /tmp/ledger_in -name shadow_game_ledger.jsonl | head -1); sc=$(find /tmp/ledger_in -name SHADOW_SCORECARD.json | head -1)
          cp "$led" /tmp/shadow_game_ledger.jsonl; cp "$sc" /tmp/SHADOW_SCORECARD.json
          git config user.name "nhl-edge-bot"
          git config user.email "nhl-edge-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin model-research-ledger >/dev/null 2>&1; then
            git fetch origin model-research-ledger
            git checkout -B model-research-ledger origin/model-research-ledger
          else
            git checkout --orphan model-research-ledger
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp /tmp/shadow_game_ledger.jsonl ./shadow_game_ledger.jsonl
          cp /tmp/SHADOW_SCORECARD.json ./SHADOW_SCORECARD.json
          git add shadow_game_ledger.jsonl SHADOW_SCORECARD.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "model-research: settle ${SLATE_DATE} (run ${GITHUB_RUN_ID})"
          git push origin model-research-ledger
