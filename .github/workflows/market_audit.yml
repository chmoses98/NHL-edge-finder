name: market_audit
# NHL historical market audit (RESEARCH_ONLY). DISABLED BY DEFAULT: manual dispatch only; the schedule below is commented out and
# enabling it needs an explicit decision. Reads a COPY of data-archive / accounting-data (read-only), runs the bounded, idempotent,
# resumable pipeline, uploads the machine-readable outputs as an artifact, and -- only when `publish` is true -- appends ONE line to
# the evidence ledger on its own branch `market-audit-ledger` (normal commits, never forced; write permission is granted only to a separate publish job). It never writes to the default branch, data-archive or
# accounting-data, never places or routes a wager, and changes no model, stake or cap.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Append the scorecard line to the market-audit-ledger branch (true/false)"
        required: false
        default: "false"
  # schedule:                      # ENABLE ONLY WITH EXPLICIT APPROVAL: one run a day keeps Actions usage to ~25 min/day
  #   - cron: "37 11 * * *"

permissions:
  contents: read

concurrency:
  group: market-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install hash-locked dependencies (no resolver, no source builds; any hash mismatch fails the job)
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements/research-runtime.lock
          echo "PYTHONPATH=$GITHUB_WORKSPACE/src" >> "$GITHUB_ENV"
      - name: Fetch read-only copies of the archive and the accounting ledger
        run: |
          set -euo pipefail
          git fetch --depth=1 origin data-archive accounting-data
          mkdir -p $RUNNER_TEMP/rd/archive $RUNNER_TEMP/rd/accounting
          git archive origin/data-archive | tar -x -C $RUNNER_TEMP/rd/archive
          git archive origin/accounting-data | tar -x -C $RUNNER_TEMP/rd/accounting
      - name: Restore the evidence ledger (if it exists)
        run: |
          mkdir -p $RUNNER_TEMP/rd/ledger
          if git ls-remote --exit-code --heads origin market-audit-ledger >/dev/null 2>&1; then
            git fetch --depth=1 origin market-audit-ledger
            git show origin/market-audit-ledger:evidence_ledger.jsonl > $RUNNER_TEMP/rd/ledger/evidence_ledger.jsonl || true
          fi
      - name: Run the audit pipeline (resumable; unchanged inputs are skipped)
        run: |
          python -m nhl_edge.market_audit.pipeline --archive $RUNNER_TEMP/rd/archive --accounting $RUNNER_TEMP/rd/accounting \
            --history data/history --repo . --work $RUNNER_TEMP/rd/work --out $RUNNER_TEMP/rd/out
      - name: Scorecard + evidence ledger (idempotent per archive snapshot)
        run: python -m nhl_edge.market_audit.scorecard --data $RUNNER_TEMP/rd/out --ledger $RUNNER_TEMP/rd/ledger/evidence_ledger.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: market-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/rd/out/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ github.event.inputs.publish == 'true' }}
        with:
          name: market-audit-ledger-private-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/rd/ledger/evidence_ledger.jsonl
            ${{ runner.temp }}/rd/out/SCORECARD.md
          retention-days: 1

  publish:
    needs: audit
    if: ${{ github.event.inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # the only write grant in this workflow; pushes to market-audit-ledger and nothing else
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: market-audit-ledger-private-${{ github.run_id }}
          path: ${{ runner.temp }}/ledger_in
      - name: Commit to market-audit-ledger (normal commit, never forced)
        run: |
          set -euo pipefail
          led=$(find "$RUNNER_TEMP/ledger_in" -name evidence_ledger.jsonl | head -1); sc=$(find "$RUNNER_TEMP/ledger_in" -name SCORECARD.md | head -1)
          cp "$led" "$RUNNER_TEMP/evidence_ledger.jsonl"; cp "$sc" "$RUNNER_TEMP/SCORECARD.md"
          git config user.name "nhl-edge-bot"
          git config user.email "nhl-edge-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin market-audit-ledger >/dev/null 2>&1; then
            git fetch origin market-audit-ledger
            git checkout -B market-audit-ledger origin/market-audit-ledger
          else
            git checkout --orphan market-audit-ledger
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp "$RUNNER_TEMP/evidence_ledger.jsonl" ./evidence_ledger.jsonl
          cp "$RUNNER_TEMP/SCORECARD.md" ./SCORECARD.md
          git add evidence_ledger.jsonl SCORECARD.md
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "market-audit: scorecard ${GITHUB_RUN_ID}"
          git push origin market-audit-ledger
